<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Graveyard - Play the Best Games Online" />
  <title>Graveyard Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 🔴 Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-content">
      <p class="loading-text">🚀 Loading Graveyard Hub... made by <strong>TIXU</strong></p>
      <div class="wrapper">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="shadow"></div>
        <div class="shadow"></div>
        <div class="shadow"></div>
      </div>
    </div>
  </div>

  <!-- 🔥 Main Content -->
  <div class="container" id="mainContent">
    <h1>GraveYards Made By TIXU</h1>
    <p>Play the best games online for free!</p>

    <input type="text" id="search" class="search-bar" placeholder="🔍 Search for a game..." onkeyup="searchGames()">

    <h2>🔥 Popular Games</h2>
    <div class="game-grid" id="gameGrid">
      <div class="game">
        <img src="https://www.onlinegames.io/media/posts/364/responsive/Archer-Hero-Online-xs.jpg" alt="Game 1">
        <a href="https://www.onlinegames.io/games/2023/unity/archer-hero/index.html">🚀 Play Game 1</a>
      </div>
      <div class="game">
        <img src="https://www.onlinegames.io/media/posts/740/responsive/Crazy-Karts-xs.jpg" alt="Game 2">
        <a href="https://www.onlinegames.io/games/2024/unity/crazy-karts/index.html">⚡ Play Game 2</a>
      </div>
      <div class="game">
        <img src="https://www.onlinegames.io/media/posts/330/responsive/Cat-Simulator-Online-xs.jpg" alt="Game 3">
        <a href="https://www.onlinegames.io/games/2022/unity4/cat-simulator/index.html">🔥 Play Game 3</a>
      </div>
      <div class="game">
        <img src="https://www.onlinegames.io/media/posts/971/responsive/Cookie-Clicker-Pro-Game-xs.jpg" alt="Game 4">
        <a href="https://cloud.onlinegames.io/games/2025/unity/cookie-clicker-pro/index-og.html">🎯 Play Game 4</a>
      </div>
      <div class="game">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTiX-_uMkKQoVPggcWJ6GtHGgtkXZu9FsMzD-8op5nUug&s" alt="Math Cheat">
        <a href="a1">🎯 Math Cheater</a>
      </div>
    </div>

    <p class="credits">© 2025 Game Hub | Created by TIXU-RAMP</p>
  </div>

  <script>
    // Simple loading screen logic
    window.addEventListener('load', () => {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    });

    function searchGames() {
      const input = document.getElementById('search').value.toLowerCase();
      const games = document.querySelectorAll('.game');

      games.forEach(game => {
        const text = game.textContent.toLowerCase();
        game.style.display = text.includes(input) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
